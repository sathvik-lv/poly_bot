name: Poly Bot (Hourly)

on:
  schedule:
    # Hourly. Wall time dropped sharply on 2026-09-22 when the ten paper-trading
    # arms were removed (see the note below), so cycles no longer overlap.
    - cron: '0 * * * *'
  workflow_dispatch:

# Cancel any previous in-progress cycle when a new one starts. Prevents
# the overlap that was causing repeated cancellations.
concurrency:
  group: cycle
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # data/ now lives in the PRIVATE repo sathvik-lv/poly_bot-data, so live
      # paper positions, ledgers and fitted weights are no longer published
      # hourly to this public repo. Deliberately NO continue-on-error here:
      # if this checkout fails, the scripts would start from empty state and
      # silently break ledger continuity across every experiment arm. Better
      # to fail the run loudly than to corrupt the data.
      - name: Checkout private data repo into data/
        uses: actions/checkout@v4
        with:
          repository: sathvik-lv/poly_bot-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: data

      # Second guard: a checkout can "succeed" with an empty/partial tree.
      # Refuse to run the cycle unless the core ledger is actually present.
      - name: Verify data/ is populated
        run: |
          test -f data/paper_trades.json || {
            echo "::error::data/paper_trades.json missing — data repo checkout looks empty. Aborting before scripts can overwrite ledgers with empty state."
            exit 1
          }
          echo "data/ OK ($(find data -type f | wc -l) files)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install python-dotenv

      - name: Create .env
        run: |
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "METACULUS_API_TOKEN=${{ secrets.METACULUS_API_TOKEN }}" >> .env
          echo "RELAYER_API_KEY=${{ secrets.RELAYER_API_KEY }}" >> .env
          echo "RELAYER_API_KEY_ADDRESS=${{ secrets.RELAYER_API_KEY_ADDRESS }}" >> .env
          echo "FMP_API_KEY=${{ secrets.FMP_API_KEY }}" >> .env
          echo "MARKETSTACK_KEY=${{ secrets.MARKETSTACK_KEY }}" >> .env
          echo "ALPHA_VANTAGE_KEY=${{ secrets.ALPHA_VANTAGE_KEY }}" >> .env
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> .env

      # ============================================================
      # PAPER-TRADING ARMS REMOVED 2026-09-22
      #
      # Removed: Test 0, Test 0-TIER, V3a, V3b, V3c, V5, V5-TIER, V6,
      # V6-TIER (27 steps), the same-window comparison (compare_arms.py),
      # and the whole V2 block (collector, resolver, weight trainer,
      # meta trainer, exit sim, V2 report, V1-vs-V2).
      #
      # Why: src/prediction_engine.py lines 499/823/999 do
      # `outcome_prices.get("Yes", 0.5)`. Markets whose outcomes are
      # competitor names (most sports) have no "Yes" key, so the engine
      # silently priced them at exactly $0.500. 94.6% of the 907 closed
      # trades across all arms were booked at that fabricated price, and
      # winners appeared to pay ~2x. Re-priced against real
      # price_history.json snapshots, no arm had a positive edge whose 95%
      # CI excluded zero. Two independent well-powered measurements agree
      # there is no alpha: rolling_accuracy.json (April, n=5,211, real
      # pre_prices, ensemble 0.1672 vs market 0.1670) and a September
      # re-scoring against snapshots (n=1,055 markets, model 0.0233 WORSE,
      # t=+8.35).
      #
      # So these steps were spending ~35 min of every cycle accumulating
      # ledger rows that are fiction. compare_arms.py went too because with
      # the arms stopped it would print the same frozen "PROVEN EDGE"
      # verdicts every hour — a misleading artifact.
      #
      # NOTHING WAS DELETED. Every data file, ledger and archive is intact
      # in the data repo, and every script remains in scripts/ and is still
      # unit-tested. To revive any arm, fix the engine pricing first (~20
      # sites — see the 2026-09-22 worklog entry; meta_model.py's feature
      # vector matters as much as the engine lines), then reset or
      # hard-label the existing ledgers, because pre-fix and post-fix rows
      # are not comparable.
      # ============================================================

      # Live tracker: kept deliberately, but note it shares the engine's
      # pricing bug — live_predictions.jsonl is ~63% fabricated $0.500
      # prices. Useful only as raw engine output, not as a P&L record.
      - name: Live tracker scan (record predictions for accuracy data)
        run: python scripts/live_tracker.py --scan -n 50
        timeout-minutes: 15
        continue-on-error: true

      - name: Resolve live predictions
        run: python scripts/live_tracker.py --resolve
        timeout-minutes: 3
        continue-on-error: true

      - name: Live tracker report
        run: python scripts/live_tracker.py --report
        timeout-minutes: 1
        continue-on-error: true

      # price_snapshots is the most valuable step in this file: it is real
      # observed market data with no model in the loop, and it is what made
      # the honest re-pricing of every arm possible. Do not remove it.
      - name: Price snapshots
        run: python scripts/price_snapshots.py
        timeout-minutes: 2
        continue-on-error: true

      - name: Finance scanner
        run: python scripts/finance_scanner.py
        timeout-minutes: 5
        continue-on-error: true

      - name: Arbitrage scanner
        run: python scripts/arbitrage_scanner.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Cross-platform comparison
        run: python scripts/cross_platform.py
        timeout-minutes: 5
        continue-on-error: true

      - name: Logical arbitrage
        run: python scripts/logical_arb.py
        timeout-minutes: 3
        continue-on-error: true

      # Emits nothing in CI by design: its BTC volatility source is Binance,
      # which blocks the US IPs GitHub runners use, so the model returns None
      # and the scanner skips rather than fabricating a signal.
      - name: Niche data scanner
        run: python scripts/niche_scanner.py
        timeout-minutes: 3
        continue-on-error: true

      # Divergence study: sportsbook consensus vs Polymarket on the same games.
      # Observation only — nothing trades. Self-throttles to one poll every
      # DIVERGENCE_POLL_HOURS and paces Odds API credits (free tier 500/mo);
      # /sports and /events are free, only /odds costs a credit.
      - name: Divergence study — collect
        run: python scripts/divergence_study.py collect
        timeout-minutes: 6
        continue-on-error: true

      - name: Divergence study — resolve + report
        run: |
          python scripts/divergence_study.py resolve
          python scripts/divergence_study.py report
        timeout-minutes: 4
        continue-on-error: true

      - name: Rotate old price snapshots
        run: python scripts/rotate_snapshots.py
        timeout-minutes: 1
        continue-on-error: true

      # Keep test1_ledger.jsonl / v2_ledger.jsonl under GitHub's 100 MB
      # per-file cap. Old resolved records get moved into gzipped monthly
      # archives under data/archive/. All readers glob current + archives
      # via src.ledger_reader so historical data stays available.
      # divergence_log.jsonl grows ~1 MB/day and should be added here well
      # before it approaches the cap.
      - name: Rotate large ledgers into archives
        run: python scripts/rotate_ledger.py
        timeout-minutes: 2
        continue-on-error: true

      # Results are committed to the PRIVATE data repo, not this one.
      # No continue-on-error: a silent push failure would mean the cycle's
      # data is lost without anyone noticing.
      - name: Commit results
        working-directory: data
        run: |
          git config user.name "poly-bot[bot]"
          git config user.email "poly-bot[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "auto: cycle $(date -u +'%Y-%m-%d %H:%M') UTC"
            # On overlapping cycles, prefer THIS run's data on conflict
            # ('theirs' in rebase = the commit being applied = our local commit).
            # The next cycle will refresh anything we drop.
            # Retry in case another push lands during the rebase.
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs && git push; then
                echo "Push succeeded on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            echo "Push failed after 3 attempts" >&2
            exit 1
          fi
